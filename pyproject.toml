[project]
name = "langlab"
version = "0.1.0"
description = "LangLab document Q&A and chatbot application"
requires-python = ">=3.12"
dependencies = [
  "boto3",
  "botocore[crt]",
  "docx2txt",
  "faiss-cpu",
  "langchain",
  "langchain-classic",
  "langchain-community",
  "langchain-openai",
  "langchain-text-splitters",
  "opensearch-py",
  "pypdf",
  "python-dotenv",
  "streamlit",
]

[tool.uv]
package = false
